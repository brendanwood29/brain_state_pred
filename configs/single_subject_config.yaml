  #   weights_only: true
  #   strict: false
  ########## Combo Model
  kwargs:
    num_blocks: 1
    in_features: ${data.num_regions}
    steps: 8
    num_mamba_blocks: 1
    trfrm_kwargs:
      num_heads: 2
    mamba_kwargs:
      d_model: ${data.num_regions}
      d_state: 64
      d_conv: 2
      expand: 4
      dropout: 0.1
    ffn_kwargs:
      num_layers: 3
      ffn_dropout: 0.1
