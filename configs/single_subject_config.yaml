num_epochs: 400
batch_size: 82 # 82 for maghz gpu - higher for fourier
device: cuda
run_name: run_1
work_dir: results/combo_model
seed: 42
k: 117 # 70 for 2 gpus and 200 epochs, 117 for 400 epochs - this puts randn = 0.2 at step 200
# batch_pbar: true
optim:
  name: adamw
  lr: 5e-4
  kwargs:
    weight_decay: 5e-5
loss:
  name: mse_loss
  # name: mse_fourier_loss
  # kwargs:
  #   recon_weight: 0.1
  #   fourier_weight: 1.0
  # name: mse_fc_loss
  # kwargs:
  #   mse_weight: 0.5
  #   fc_weight: 0.5
  # name: mse_first_loss
  # kwargs:
  #   recon_weight: 0.25
  #   first_weight: 0.75
grad_clip:
  max_norm: 1.0
# scheduler: null
scheduler:
  name: onecycle
  kwargs:
    max_lr: ${optim.lr}
    # total_steps: 2000
    pct_start: 0.0
    epochs: ${num_epochs}
    steps_per_epoch: 4
    div_factor: 250.0
    final_div_factor: 100000.0
model:
  name: combo
  print_summary: true
  num_models_to_save: 2
  save_last: true
  # freeze_modules: # TODO add warning if this is specified but init is also null also add warning for models not being the same
  #   - blocks
  # unfreeze_modules:
  #   - lora
  #   - norm
  init: null 
