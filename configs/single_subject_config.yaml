num_epochs: 200
batch_size: 82
device: all
run_name: run_1
work_dir: results/mamba_val_no_recuse
seed: 42
k: 56
# batch_pbar: true
optim:
  name: adamw
  lr: 5e-4
  kwargs:
    weight_decay: 5e-5
loss:
  name: mse_loss
  # name: mse_fourier_loss
  # kwargs:
  #   recon_weight: 0.1
  #   fourier_weight: 1.0
  # name: mse_fc_loss
