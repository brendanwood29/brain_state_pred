  # kwargs:
  #   recon_weight: 0.25
  #   first_weight: 0.75
# grad_clip:
#   max_norm: 1.0
# scheduler: null
scheduler:
  name: onecycle
  kwargs:
    max_lr: ${optim.lr}
    # total_steps: 2000
    pct_start: 0.0
    epochs: ${num_epochs}
    steps_per_epoch: 4
    div_factor: 250.0
    final_div_factor: 100000.0
model:
  name: mamba
  print_summary: true
  num_models_to_save: 2
  save_last: true
  # freeze_modules:
