num_epochs: 100
batch_size: 1600
device: all
run_name: run_1
work_dir: results/ddp_test
seed: 42
batch_pbar: true
optim:
  name: adamw
  lr: 5e-4
  kwargs:
    weight_decay: 5e-4
loss:
  name: mse_loss
  # kwargs:
  #   mse_weight: 1.0
  #   fc_weight: 0.5
grad_clip:
  max_norm: 1.0
# scheduler: null
scheduler:
  # null
  name: onecycle
  kwargs:
    max_lr: ${optim.lr}
    # total_steps: 1000
    steps_per_epoch: 153
    epochs: ${num_epochs}
    pct_start: 0.0
model:
  name: mamba
  print_summary: true
  num_models_to_save: 3
  save_last: true
  # freeze_modules:
  #   - model
  # unfreeze_modules:
  #   - lora
  #   - norm
  init:
    null
    # weights: npi_result_more-data-transformer/run_1/models/run_1_best_val_loss_0.1445.pt
    # weights_only: true
    # strict: false
  # kwargs:
  #   input_size: 360
  #   hidden_size: 128
  #   num_layers: 1
  #   steps: 15
  # proj_size: 360
  ########## GCN
  # kwargs:
  #   num_features: 20
  #   hidden_dim: 128
  ######### GCTN
  # kwargs:
  #   in_channels: 20
  #   out_channels: 1
  #   heads: 12
  #   dropout: 0.0
  ########## STGCN
  # kwargs:
  #   num_nodes: 360
  #   in_features: 1
  #   hidden_dim: 10
  #   out_features: 1
  kwargs:
    num_blocks: 6
    d_model: ${data.num_regions}
    d_state: 256
    d_conv: 8
    expand: 4
    dropout: 0.30
    steps: 8
  ########## Transformer with lora
  # kwargs:
  #   in_features: 100
  #   num_heads: 2
  #   steps: 20
  #   num_blocks: 5
  #   # masked_attn: false
  #   attn_drop_prob: 0.3
  #   final_drop_prob: 0.3
  #   ffn_dropout: 0.3
  # #   use_lora: true
