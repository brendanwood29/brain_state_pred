callbacks:
  use_early_stopping: false
  patience: 5
  threshold: 0.0001
data:
  train_proportion: 0.8
  noise_strength: 1.0
  target_tr: 2
  num_regions: 400
  train:
    data_path: splits/splits_400p/train.json
    step: ${model.kwargs.steps}
    shuffle: true
    # threshold: 0.8
  val:
    data_path: splits/splits_400p/val.json
    step: ${data.train.step}
    shuffle: false
    # threshold: 0.8
