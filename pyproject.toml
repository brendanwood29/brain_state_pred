[project]
name = "brain-state-pred"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "debugpy>=1.8.20",
    "dtw-python>=1.9.0",
    "matplotlib>=3.10.8",
    "nilearn>=0.13.1",
    "omegaconf>=2.3.0",
    "pandas>=3.0.1",
    "pytorch-trainer",
    "ruff>=0.15.12",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "svgutils>=0.3.4",
    "torch==2.7.0",
    "torch-geometric>=2.7.0",
    # "torch-geometric-temporal>=0.56.2",
    "torchinfo>=1.8.0",
]

[project.optional-dependencies]
cpu = ["torch==2.7.0"]
cu118 = ["torch==2.7.0"]
cu126 = ["torch==2.7.0"]
cu128 = ["torch==2.7.0"]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu118" },
    { extra = "cu126" },
    { extra = "cu128" },
  ],
]

[tool.uv.sources]
pytorch-trainer = { workspace = true }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu118", extra = "cu118" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.extra-build-dependencies]
    torch-sparse = ["torch"]

[tool.uv.workspace]
members = [
    "pytorch_trainer",
]

# Ruff details
[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true 
[tool.ruff.lint]
select = ["E", "F", "I"]  

# pright details
[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = './pytorch_trainer/src/pytorch_trainer/'
